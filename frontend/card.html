<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Motivation Card - MentalAI+</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/static/style.css?v=1.7">
</head>
<body class="bg-gray-50 text-gray-800 pt-20">

    <div id="navbar-placeholder"></div>

    <!-- Ana İçerik -->
    <div class="container mx-auto p-4 md:p-8 max-w-2xl">
        <header class="text-center mb-8">
            <h1 class="text-4xl font-bold text-amber-600">Günün Motivasyon Kartı</h1>
            <p class="text-lg text-gray-600 mt-2">Ruh haline özel bir kart çek veya rastgele ilham al.</p>
        </header>
        <div class="bg-white p-6 rounded-2xl shadow-lg mb-8">
            <div class="flex flex-col sm:flex-row gap-4 items-center">
                <div class="w-full sm:w-1/2">
                    <label for="card_user_id" class="block text-sm font-medium text-gray-700 mb-1">Kullanıcı ID (İsteğe Bağlı)</label>
                    <input type="text" id="card_user_id" class="w-full px-3 py-2 border border-gray-300 rounded-lg shadow-sm" placeholder="Kişiye özel kart için kullanıcı ID girin">
                    <p class="text-xs text-gray-500 mt-1">Giriş yaptıysanız ID otomatik doldurulacak</p>
                </div>
                <button id="fetch-card-button" class="w-full sm:w-auto self-end bg-amber-500 text-white font-bold py-2.5 px-8 rounded-lg hover:bg-amber-600">
                    Kart Çek
                </button>
            </div>
        </div>
        <div id="card-loading" class="text-center my-8 hidden"></div>
        <div id="card-error" class="my-8 p-4 bg-red-100 text-red-700 rounded-lg hidden text-center"></div>
        <div id="card-scene" class="card-scene">
            <div id="card-container" class="card-container">
                <div class="card-face card-front">
                    <span class="text-2xl font-bold text-amber-700">MentalAI+</span>
                </div>
                <div id="card-back" class="card-face card-back"></div>
            </div>
        </div>
    </div>
    <script src="/static/nav.js?v=1.0"></script>
    <script src="/static/card.js?v=1.0"></script>
</body>
</html>
