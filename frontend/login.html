<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Giriş Yap - MentalAI+</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css?v=1.8">
</head>
<body class="bg-gray-50 text-gray-800 pt-20">

    <div id="navbar-placeholder"></div>

    <!-- Ana İçerik -->
    <div class="container mx-auto p-4 md:p-8 max-w-md">
        <div class="bg-white p-8 rounded-2xl shadow-lg">
            <header class="text-center mb-8">
                <h1 class="text-3xl font-bold text-gray-800">Giriş Yap</h1>
                <p class="text-gray-500 mt-2">Hesabına erişmek için bilgilerini gir.</p>
            </header>
            <form id="login-form">
                <div class="mb-4">
                    <label for="email" class="block text-sm font-medium text-gray-700 mb-1">E-posta Adresi</label>
                    <input type="email" id="email" name="email" class="w-full px-3 py-2 border border-gray-300 rounded-lg shadow-sm" placeholder="test@user.com" required>
                </div>
                <div class="mb-6">
                    <label for="password" class="block text-sm font-medium text-gray-700 mb-1">Şifre</label>
                    <input type="password" id="password" name="password" class="w-full px-3 py-2 border border-gray-300 rounded-lg shadow-sm" placeholder="••••••••" required>
                </div>

                <div id="login-error" class="mb-4 p-3 bg-red-100 text-red-700 rounded-lg hidden text-center"></div>
                <div id="login-success" class="mb-4 p-3 bg-green-100 text-green-700 rounded-lg hidden text-center"></div>

                <button type="submit" id="login-button" class="w-full bg-blue-600 text-white font-bold py-3 px-4 rounded-lg hover:bg-blue-700 transition-colors">
                    Giriş Yap
                </button>
            </form>
            <p class="text-center text-sm text-gray-500 mt-6">
                Hesabın yok mu? <a href="#" class="font-medium text-blue-600 hover:underline">Kayıt Ol</a>
            </p>
        </div>
    </div>
    <script src="nav.js?v=1.0"></script>
    <script src="login.js?v=1.0"></script>
</body>
</html>
