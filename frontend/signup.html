<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kayıt Ol - MentalAI+</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/static/style.css?v=1.8">
</head>
<body class="bg-gray-50 text-gray-800 pt-20">

    <div id="navbar-placeholder"></div>

    <!-- Ana İçerik -->
    <div class="container mx-auto p-4 md:p-8 max-w-md">
        <div class="bg-white p-8 rounded-2xl shadow-lg">
            <header class="text-center mb-8">
                <h1 class="text-3xl font-bold text-gray-800">Kayıt Ol</h1>
                <p class="text-gray-500 mt-2">MentalAI+ ailesine katıl ve yolculuğuna başla.</p>
            </header>
            <form id="signup-form">
                <div class="mb-4">
                    <label for="username" class="block text-sm font-medium text-gray-700 mb-1">Kullanıcı ID</label>
                    <input type="text" id="username" name="username" class="w-full px-3 py-2 border border-gray-300 rounded-lg shadow-sm focus:ring-2 focus:ring-blue-500 focus:border-blue-500" placeholder="Örn: kullanici123" required>
                    <p class="text-xs text-gray-500 mt-1">En az 3 karakter, sadece harf, rakam ve alt çizgi</p>
                </div>
                <div class="mb-4">
                    <label for="email" class="block text-sm font-medium text-gray-700 mb-1">E-posta (İsteğe bağlı)</label>
                    <input type="email" id="email" name="email" class="w-full px-3 py-2 border border-gray-300 rounded-lg shadow-sm focus:ring-2 focus:ring-blue-500 focus:border-blue-500" placeholder="ornek@email.com">
                </div>
                <div class="mb-4">
                    <label for="password" class="block text-sm font-medium text-gray-700 mb-1">Şifre</label>
                    <input type="password" id="password" name="password" class="w-full px-3 py-2 border border-gray-300 rounded-lg shadow-sm focus:ring-2 focus:ring-blue-500 focus:border-blue-500" placeholder="Güçlü bir şifre oluşturun" required>
                    <p class="text-xs text-gray-500 mt-1">En az 8 karakter, 1 büyük harf ve 1 özel karakter</p>
                </div>
                <div class="mb-4">
                    <label for="confirm-password" class="block text-sm font-medium text-gray-700 mb-1">Şifre Tekrar</label>
                    <input type="password" id="confirm-password" name="confirm-password" class="w-full px-3 py-2 border border-gray-300 rounded-lg shadow-sm focus:ring-2 focus:ring-blue-500 focus:border-blue-500" placeholder="Şifrenizi tekrar girin" required>
                </div>

                <div id="signup-error" class="mb-4 p-3 bg-red-100 text-red-700 rounded-lg hidden text-center"></div>
                <div id="signup-success" class="mb-4 p-3 bg-green-100 text-green-700 rounded-lg hidden text-center"></div>

                <button type="submit" id="signup-button" class="w-full bg-blue-600 text-white font-bold py-3 px-4 rounded-lg hover:bg-blue-700 transition-colors">
                    Kayıt Ol
                </button>
            </form>
            <p class="text-center text-sm text-gray-500 mt-6">
                Zaten hesabın var mı? <a href="/login" class="font-medium text-blue-600 hover:underline">Giriş Yap</a>
            </p>
        </div>
    </div>

    <script src="/static/nav.js?v=1.0"></script>
    <script>
        document.addEventListener("DOMContentLoaded", function() {
            const signupForm = document.getElementById("signup-form");
            const signupError = document.getElementById("signup-error");
            const signupSuccess = document.getElementById("signup-success");
            const signupButton = document.getElementById("signup-button");

            signupForm.addEventListener("submit", async function(e) {
                e.preventDefault();
                
                const username = document.getElementById("username").value;
                const email = document.getElementById("email").value;
                const password = document.getElementById("password").value;
                const confirmPassword = document.getElementById("confirm-password").value;

                // Şifre eşleşme kontrolü
                if (password !== confirmPassword) {
                    showError("Şifreler eşleşmiyor");
                    return;
                }

                // Kullanıcı adı format kontrolü
                if (!/^[a-zA-Z0-9_]{3,}$/.test(username)) {
                    showError("Kullanıcı adı en az 3 karakter olmalı ve sadece harf, rakam ve alt çizgi içermelidir");
                    return;
                }

                signupButton.disabled = true;
                signupButton.textContent = "Kayıt olunuyor...";

                try {
                    const formData = new FormData();
                    formData.append("username", username);
                    formData.append("password", password);
                    if (email) {
                        formData.append("email", email);
                    }

                    const response = await fetch("http://localhost:8000/auth/register", {
                        method: "POST",
                        body: formData
                    });

                    const data = await response.json();

                    if (response.ok) {
                        showSuccess("Kayıt başarılı! Giriş sayfasına yönlendiriliyorsunuz...");
                        setTimeout(() => {
                            window.location.href = "/login";
                        }, 2000);
                    } else {
                        showError(data.detail || "Kayıt başarısız");
                    }
                } catch (error) {
                    showError("Bağlantı hatası. Lütfen tekrar deneyin.");
                } finally {
                    signupButton.disabled = false;
                    signupButton.textContent = "Kayıt Ol";
                }
            });

            function showError(message) {
                signupError.textContent = message;
                signupError.classList.remove("hidden");
                signupSuccess.classList.add("hidden");
            }

            function showSuccess(message) {
                signupSuccess.textContent = message;
                signupSuccess.classList.remove("hidden");
                signupError.classList.add("hidden");
            }
        });
    </script>
</body>
</html>
