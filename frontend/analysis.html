<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Analiz - MentalAI+</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chartjs-plugin-datalabels@2.2.0"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css?v=1.8">
</head>
<body class="bg-gray-50 text-gray-800 pt-20">

    <div id="navbar-placeholder"></div>

    <!-- Ana İçerik -->
    <div class="container mx-auto p-4 md:p-8 max-w-4xl">
        <header class="text-center mb-8">
            <h1 class="text-4xl font-bold text-indigo-600">Duygu Analizi</h1>
            <p class="text-lg text-gray-600 mt-2">Duygu durumunu grafiklerle incele.</p>
        </header>
        <div class="mb-8 max-w-md mx-auto">
            <label for="user_id" class="block text-sm font-medium text-gray-700 mb-1">Analiz için Kullanıcı ID'ni gir:</label>
            <input type="text" id="user_id" class="w-full px-3 py-2 border border-gray-300 rounded-lg shadow-sm" placeholder="Örn: kullanici123">
        </div>
        <div id="analysis-controls" class="bg-white p-6 rounded-2xl shadow-lg">
            <div class="flex flex-wrap gap-4 items-end">
                <div class="flex gap-2">
                    <button data-period="7" class="period-button bg-gray-200 text-gray-700 font-semibold py-2 px-4 rounded-lg">Son 7 Gün</button>
                    <button data-period="30" class="period-button bg-gray-200 text-gray-700 font-semibold py-2 px-4 rounded-lg">Son 30 Gün</button>
                </div>
                <div class="flex flex-wrap items-end gap-2 flex-1 min-w-[300px]">
                    <div class="flex-1">
                        <label for="start-date" class="text-sm font-medium text-gray-600">Başlangıç</label>
                        <input type="date" id="start-date" class="w-full mt-1 px-3 py-2 border border-gray-300 rounded-lg">
                    </div>
                    <div class="flex-1">
                        <label for="end-date" class="text-sm font-medium text-gray-600">Bitiş</label>
                        <input type="date" id="end-date" class="w-full mt-1 px-3 py-2 border border-gray-300 rounded-lg">
                    </div>
                    <button id="custom-range-button" class="bg-indigo-600 text-white font-bold py-2 px-4 rounded-lg">Sorgula</button>
                </div>
            </div>
            <div id="analysis-error" class="mt-4 p-3 bg-yellow-100 text-yellow-800 rounded-lg hidden text-center"></div>
            <div class="relative h-96 w-full max-w-lg mx-auto mt-6">
                <canvas id="emotionChart"></canvas>
            </div>
        </div>
    </div>
    <script src="nav.js?v=1.0"></script>
    <script src="analysis.js?v=1.0"></script>
</body>
</html>
